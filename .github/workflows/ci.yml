name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-version: ["5.1", "5.4"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest

  # The gates that are not `dune runtest`: cross-backend parity, the differential
  # checks against other people's implementations (node's URL and TextDecoder,
  # QEMU), self-hosting, and the language server.
  #
  # These live in scripts/ and were run by hand until now, which is the same
  # exposure as a measurement that only exists in /tmp — a gate nobody runs is a
  # gate that is not protecting anything. str_replace was returning a buffer with
  # no length header on the C backend for as long as it had existed, and what
  # found it was scripts/parity.sh: exactly one of these.
  #
  # One step per harness, so a red build names the gate rather than a log line.
  # Every script here exits non-zero on a real failure and exits zero with a
  # printed reason when a dependency is absent, so a green job means each step
  # either passed or said why it did not run.
  #
  # Linux only, and that is deliberate rather than a shortcut: development
  # happens on macOS, where these are run before every commit, so the two
  # platforms end up covered between CI and the working copy.
  gates:
    name: Gates (cross-backend and differential)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      # The oracle for url_parity and encoding_parity is node's URL and
      # TextDecoder, so node is a pinned dependency and not whatever the image
      # happens to ship. The runner's default was v22, which predates two
      # changes to the URL Standard — `^` in the path percent-encode set, and
      # `..` resolved against an empty path — and reported our spec-correct
      # answers as failures. An unpinned oracle makes the result depend on the
      # machine, which is the thing a differential gate exists to avoid.
      - name: Set up Node (the differential oracle)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # clang, because the LLVM backend's output is LLVM IR and gcc cannot
      # compile it — parity.sh would report MISCOMPILE for every case rather
      # than skipping. wabt for the wasm backend. lldb for debug_info, which
      # only asks where a breakpoint resolves and never runs the process, so
      # none of this touches ptrace.
      - name: Install harness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang wabt lldb
          # SDL2 for the window capability. window_check.sh skips without it, and
          # a skipped gate is a gate that is not running — so install it here.
          sudo apt-get install -y libsdl2-dev

      # socket_parity builds a Wasm component and compares its socket behaviour
      # against the C build, so it needs the component toolchain: wasm-tools,
      # wasmtime, and the WASI command adapter that ships inside jco. Pinned to
      # the versions development runs against, for the reason the node pin
      # exists — a tool that decides a gate's answer is a versioned dependency.
      - name: Install the Wasm component toolchain
        run: |
          set -e
          WASM_TOOLS=1.255.0
          WASMTIME=46.0.1
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS}/wasm-tools-${WASM_TOOLS}-x86_64-linux.tar.gz" \
            | tar -xz -C /tmp
          install "/tmp/wasm-tools-${WASM_TOOLS}-x86_64-linux/wasm-tools" "$HOME/.local/bin/"
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME}/wasmtime-v${WASMTIME}-x86_64-linux.tar.xz" \
            | tar -xJ -C /tmp
          install "/tmp/wasmtime-v${WASMTIME}-x86_64-linux/wasmtime" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @bytecodealliance/jco@1.27.0
          # graphql-js is the oracle for graphql_parity.sh. Pinned for the same
          # reason as everything else here: the gate's answer comes from it.
          npm install -g graphql@17.0.2

      # protoc is the oracle for proto_parity.sh, and it is pinned for the same
      # reason node is: a gate whose answer comes from a tool inherits that
      # tool's version. The wire format itself is frozen — protobuf's
      # compatibility guarantee is that these bytes never change — so unlike
      # node's URL, a version bump here is not expected to move any answer. The
      # pin is so that if one ever does, the diff names a version change instead
      # of looking like a regression in contrib/proto.
      - name: Install protoc (oracle for proto_parity)
        run: |
          set -e
          PROTOC=27.3
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC}/protoc-${PROTOC}-linux-x86_64.zip" \
            -o /tmp/protoc.zip
          unzip -q -o /tmp/protoc.zip -d /tmp/protoc
          install /tmp/protoc/bin/protoc "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Best effort: qemu_virt.sh is the differential check against an emulator
      # nobody here wrote, and it skips cleanly when the binary is absent. It is
      # installed separately and allowed to fail so that a package rename
      # degrades this gate to a skip instead of turning the build red.
      - name: Install qemu-system-riscv32 (optional gate)
        continue-on-error: true
        run: sudo apt-get install -y qemu-system-misc

      # grpcurl is one of the two clients grpc_parity drives. Pinned, like every
      # other oracle here — and it is an ORACLE in the useful sense: it was
      # written by people who never saw this implementation.
      - name: Install grpcurl (client for grpc_parity)
        run: |
          set -e
          GRPCURL=1.8.8
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL}/grpcurl_${GRPCURL}_linux_x86_64.tar.gz" \
            | tar -xz -C /tmp grpcurl
          install /tmp/grpcurl "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # hyperframe is the oracle for http2_parity.sh — an independent RFC 9113
      # implementation and the frame layer of h2. Pinned for the same reason as
      # node, protoc and graphql-js: the gate's answer comes from it.
      - name: Install hyperframe / hpack (oracles for http2_parity, hpack_parity)
        run: python3 -m pip install --break-system-packages hyperframe==6.1.0 h2==4.4.1 hpack==4.2.0

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      # Asserted rather than assumed: a missing tool would otherwise turn into
      # either a silent skip (a gate that passes without running) or a storm of
      # MISCOMPILE rows. wat2wasm's flags are checked because parity.sh treats a
      # rejected flag as a failure, not as an absent toolchain.
      - name: Toolchain preflight
        run: |
          set -e
          for t in clang lldb node python3 protoc wat2wasm wasm-objdump wasm-tools wasmtime; do
            command -v "$t" >/dev/null 2>&1 || { echo "required tool missing: $t"; exit 1; }
          done
          # socket_parity finds the WASI command adapter inside the global jco
          # install, and skips without it — so its absence is asserted here too.
          adapter="$(npm root -g)/@bytecodealliance/jco/lib/wasi_snapshot_preview1.command.wasm"
          [ -f "$adapter" ] || { echo "WASI command adapter missing: $adapter"; exit 1; }
          # graphql_parity skips without this, and a gate that skips in CI is a
          # gate that passes without running.
          [ -f "$(npm root -g)/graphql/package.json" ] || { echo "graphql-js missing"; exit 1; }
          python3 -c "import hyperframe" || { echo "hyperframe missing"; exit 1; }
          python3 -c "import hpack" || { echo "hpack missing"; exit 1; }
          command -v grpcurl >/dev/null || { echo "grpcurl missing"; exit 1; }
          for f in --enable-tail-call --enable-threads; do
            wat2wasm --help 2>&1 | grep -q -- "$f" \
              || { echo "wat2wasm does not support $f"; exit 1; }
          done
          # The two node-oracle harnesses skip below this floor rather than
          # reporting phantom failures, so the floor is asserted here — a gate
          # that silently skips in CI is a gate that passes without running.
          node -e 'if (+process.versions.node.split(".")[0] < 24)
                     { console.error("node " + process.version + " is below the v24 oracle floor"); process.exit(1); }'
          clang --version | head -1
          node --version
          wat2wasm --version
          lldb --version | head -1
          wasm-tools --version
          wasmtime --version
          command -v qemu-system-riscv32 >/dev/null 2>&1 \
            && qemu-system-riscv32 --version | head -1 \
            || echo "qemu-system-riscv32 absent: qemu_virt will skip"

      # The build matrix runs this too, but without wat2wasm and node it skips
      # the self-host codegen cross-validation — 2,225 cases there against 2,430
      # here. Those 205 only run in this job, which has the toolchain.
      - name: Run tests (full, with the wasm toolchain present)
        run: opam exec -- dune runtest

      # A program that overflows, and what it says when it does. The suite checks this
      # feature by looking for the message in the EMITTED TEXT, which stayed green while
      # neither backend built on this runner at all. See v0.1.285.
      - name: stack_overflow (the fault names itself, per backend)
        run: sh scripts/stack_overflow.sh

      - name: parity (interp / C / LLVM / wasm agree)
        run: sh scripts/parity.sh

      - name: ctest (C backend end to end)
        run: sh scripts/ctest.sh

      - name: url_parity (vs node's URL)
        run: sh scripts/url_parity.sh

      - name: encoding_parity (vs node's TextDecoder)
        run: sh scripts/encoding_parity.sh

      - name: unicode_parity (vs node's Intl.Segmenter)
        run: sh scripts/unicode_parity.sh

      # No oracle exists for UAX #14, so this one runs the Unicode Consortium's
      # own conformance file, vendored under test/data so it needs no network.
      - name: linebreak_conformance (UCD test file)
        run: sh scripts/linebreak_conformance.sh

      # Normalization is the one algorithm here with both kinds of gate: an
      # independent implementation above, and the UCD's exhaustive file here.
      - name: normalize_conformance (UCD test file)
        run: sh scripts/normalize_conformance.sh

      - name: host_matrix (every builtin on every backend)
        run: sh scripts/host_matrix.sh

      # These two landed with v0.1.304/305 but were never wired in here — a
      # gate that exists and does not run is a claim, not a check.
      - name: thread_leak_check (a leak is reported, a join is not)
        run: sh scripts/thread_leak_check.sh

      - name: virtual_clock_check (parked threads advance the clock)
        run: sh scripts/virtual_clock_check.sh

      # Arena capacity stays proportional to allocation: one giant allocation
      # must neither strand the bump block's tail nor become the doubling base
      # (v0.1.307). Deterministic — the meter is MERE_REGION_STATS, not RSS.
      - name: region_slack_check (capacity tracks allocation)
        run: sh scripts/region_slack_check.sh

      # The enumerated escape table. Every way a region-bound value can reach
      # something that outlives its block, with what each entry point answers
      # -- and the four compiling backends must agree, because two backends
      # disagreeing with nothing watching is what Q-053 was. Open holes are
      # rows, not absences: if one closes, this FAILS until the table says so.
      - name: escape_check (region escape routes, enumerated)
        run: sh scripts/escape_check.sh

      # The README, executed. Its Quick-examples transcript is cut from the
      # file at run time and run, the counts it states are re-derived from the
      # repo, and a newcomer's first program is built and run outside this
      # directory on two backends. `install.sh` once served a binary 260
      # versions old while every gate here was green: nothing was pointed
      # outward. This is.
      - name: first_run_check (the README, executed)
        run: sh scripts/first_run_check.sh

      # Parts of the Wasm runtime are literal WAT text gated behind a flag only
      # a program using that feature sets, so text nobody reaches is never
      # validated and a representation change walks past it. Q-068 and Q-069
      # were both that, in sections wrong since values widened. Every gated
      # section needs a program, or a written reason it cannot have one.
      - name: section_coverage (every hand-written runtime section has a program)
        run: sh scripts/section_coverage.sh

      # The cross-language benchmark suite, deterministic half only: every
      # implementation of a workload must print the same bytes, Mere's
      # programs must build, and the default region's cumulative allocation
      # must stay in its recorded band. No wall clock and no peak RSS -- both
      # measure the runner. Reference toolchains absent from the image are
      # skipped with a printed reason rather than silently.
      - name: bench_check (the implementations agree; allocation is in band)
        run: sh scripts/bench_check.sh

      # The --lib boundary, checked from the outside: the .so's exported
      # symbol set is exactly the boundary, a C host linking it gets the
      # right values, and module init runs once (v0.1.308).
      - name: lib_check (shared-library boundary)
        run: sh scripts/lib_check.sh

      # Readiness I/O (v0.1.313): the transcript checks both directions --
      # events arrive when they should, none are invented when nothing
      # happened -- and pins the coded would-block returns on nonblocking
      # read / accept / write.
      - name: io_poll_check (readiness answers what it claims)
        run: sh scripts/io_poll_check.sh

      # Audio output (v0.1.314): the queue's contract under the SDL dummy
      # driver — visible pending bytes, bounded drain to exactly 0, -1 after
      # close. Sample correctness is the consumer's oracle, not this gate's.
      - name: audio_check (the audio queue's contract, headless)
        run: sh scripts/audio_check.sh

      # Float results must not depend on the C optimizer (v0.1.315): the
      # same dot product at -O0 and -O2 must produce the same bits, and both
      # must match the interpreter. Without the emitted FP_CONTRACT OFF
      # pragma, clang's default fma contraction breaks both claims.
      - name: fp_contract_check (the optimizer must not change the answer)
        run: sh scripts/fp_contract_check.sh

      - name: selfhost_check
        run: sh scripts/selfhost_check.sh

      - name: lsp_smoke
        run: sh scripts/lsp_smoke.sh

      - name: socket_parity
        run: sh scripts/socket_parity.sh

      # Three runtime sections exist only under `-w --component`, so the parity
      # harness -- which compiles with plain `-w` -- cannot reach them at all.
      # This builds and RUNS them against the interpreter. It shares the
      # component toolchain installed for socket_parity above, and skips loudly
      # rather than silently if that toolchain is absent.
      - name: component_parity (the component-only sections, run)
        run: sh scripts/component_parity.sh

      - name: tcp_read_codes
        run: sh scripts/tcp_read_codes.sh

      # The Protocol Buffers wire format against protoc's BYTES. Runs the
      # interpreter AND the C backend, because two of its four sections are about
      # the int-width difference between them: above 2^62 the interpreter is
      # 63-bit and the compiled backends are 64-bit, and that divergence is
      # PINNED here rather than dropped, so a fix breaks this gate and says so.
      - name: proto_parity (vs protoc's bytes)
        run: sh scripts/proto_parity.sh

      # The .proto parser and descriptor encoder, byte-identical to
      # `protoc --descriptor_set_out`. This is where the bootstrap closes: a
      # descriptor set is itself a protobuf message, so the code that reads a
      # schema is serialised by the code that reads wire bytes and one oracle
      # checks both layers at once.
      - name: proto_desc_parity (vs protoc's descriptor set)
        run: sh scripts/proto_desc_parity.sh

      # The GENERATED codec against protoc's bytes: decode protoc's output and
      # re-encode it, and require the two byte strings to be identical. Also diffs
      # the committed examples/hello_pb.mere against a fresh run, because a
      # generator whose output nobody reads is a generator nobody can review.
      - name: proto_gen_parity (generated codec vs protoc's bytes)
        run: sh scripts/proto_gen_parity.sh

      # The GraphQL parser and printer against graphql-js, by sending our output
      # back through their parser rather than by comparing serialised ASTs — so
      # nothing here transcribes their tree, and a shared misreading has nowhere
      # to hide. A deliberately broken lexer proved the round-trip alone is blind
      # to the Int/Float distinction, so the harness asks for that kind directly.
      - name: graphql_parity (vs graphql-js)
        run: sh scripts/graphql_parity.sh

      # The executor against graphql-js's execute(), with the resolvers being the
      # DATA on both sides so nothing about resolution is transcribed. What it
      # really exercises is null propagation: a non-null field that resolves to
      # null destroys the nearest nullable ancestor, and an item error in [Int!]
      # nulls the whole list.
      - name: graphql_exec_parity (vs graphql-js execute)
        run: sh scripts/graphql_exec_parity.sh

      - name: graphql_intro_parity (vs graphql-js introspection)
        run: sh scripts/graphql_intro_parity.sh

      - name: graphql_validate_parity (vs graphql-js validate)
        run: sh scripts/graphql_validate_parity.sh

      - name: graphql_server_parity (a native GraphQL endpoint, real clients)
        run: sh scripts/graphql_server_parity.sh

      # HTTP/2 framing against hyperframe, in both directions, plus the reserved
      # bit of the stream identifier — the one field that behaves correctly
      # against every well-behaved peer while being wrong.
      - name: http2_parity (vs hyperframe)
        run: sh scripts/http2_parity.sh

      # HPACK against the Python hpack library, per CONNECTION rather than per
      # block — a desynchronised dynamic table does not error, it reports a
      # different header name. Includes a block captured from grpc-go, which is
      # what checks the two tables the oracle and the implementation share.
      - name: hpack_parity (vs hpack)
        run: sh scripts/hpack_parity.sh

      # The whole stack, driven by clients that know nothing about it: grpcurl
      # (Go) over four connections, and a python h2 client making three requests
      # on ONE connection with one of them split across TCP segments. The split is
      # not decoration — removing the server's frame reassembly passed every other
      # section, because on loopback a request arrives in a single read.
      - name: grpc_parity (grpcurl and python h2 against a Mere server)
        run: sh scripts/grpc_parity.sh

      # The window capability, checked by reading the window's own pixels back.
      # SDL's `dummy` video driver gives a software renderer and an event queue
      # with no display, so this needs no X server on the runner.
      - name: window_check
        run: sh scripts/window_check.sh

      # The HTML tokenizer against html5lib-tests, the suite maintained alongside
      # the specification. Vendored, so this needs no network.
      - name: html_tokenizer_conformance
        run: sh scripts/html_tokenizer_conformance.sh

      - name: infer_scaling (type inference stays linear)
        run: sh scripts/infer_scaling.sh

      - name: wasm_sourcemap
        run: sh scripts/wasm_sourcemap.sh

      - name: debug_info (lldb agrees where each line is)
        run: sh scripts/debug_info.sh

      # The RISC-V arc's headline claim is that the same bytes behave
      # identically on QEMU and on a CPU written in Mere. That emulator lives
      # in another repository, so without this checkout qemu_virt ran the QEMU
      # half only -- and reported the same pass line either way, which is how a
      # gate stops meaning what it says. It says which half it ran now, and
      # this makes the answer "both".
      # The programs written IN this language. Around three dozen dogfood
      # repositories exist, none of them with CI, and this repository could not
      # see any of them -- so a language change broke them silently and the
      # news arrived whenever somebody next opened one. test/downstream/REPOS
      # names one per surface; the check is `mere -t` from inside each, which
      # asks the question this repo can answer (is their code still a program)
      # rather than the one they own (do their tests pass).
      # A clone that fails leaves that repo absent, which the gate counts and
      # names rather than dropping.
      - name: Check out the dogfood repositories
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/downstream"
          cd "$RUNNER_TEMP/downstream"
          for r in $(awk '$1 !~ /^#/ && NF && $3 == "typecheck" {print $1}' \
                       "$GITHUB_WORKSPACE/test/downstream/REPOS"); do
            git clone --depth 1 -q "https://github.com/284km/$r.git" "$r" \
              || echo "clone failed: $r (the gate will report it absent)"
          done

      - name: downstream_check (their code is still a program)
        run: MERE_DOWNSTREAM="$RUNNER_TEMP/downstream" sh scripts/downstream_check.sh

      # memu is already among the dogfood clones above, so the RISC-V
      # differential points at that checkout rather than fetching it twice.
      # Without it, qemu_virt runs the QEMU half only -- and used to report
      # the same pass line either way, which is how a gate stops meaning what
      # it says. It names which halves ran now.
      - name: qemu_virt (vs an emulator nobody here wrote, and one we did)
        run: MEMU="$RUNNER_TEMP/downstream/memu" sh scripts/qemu_virt.sh

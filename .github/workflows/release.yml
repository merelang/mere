name: Release

# Tags build and verify binaries in a DRAFT release. Publication is a separate
# action after reviewing the downloaded assets and release notes (RUNBOOK.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      # A tag is a claim about which compiler this is. Nothing checked it, and
      # scripts/install.sh once served a binary 260 versions old while every
      # gate in the repo was green -- because no gate looked at the artifact a
      # user actually downloads. The three checks added here look at it: the
      # tag against the source, the built binary against the tag, and the
      # UPLOADED binary against the tag once it has been fetched back.
      - name: The tag must be the version in the source
        timeout-minutes: 1
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"            # v0.1.0-rc1 -> 0.1.0
          src="$(sed -n 's/^let v = "\(.*\)"$/\1/p' lib/version.ml)"
          if [ -z "$src" ]; then
            echo "release: could not read the version out of lib/version.ml" >&2
            exit 1
          fi
          if [ "$tag" != "$src" ]; then
            echo "release: tag ${GITHUB_REF_NAME} does not match lib/version.ml ($src)" >&2
            echo "release: bump the source or retag -- a release that lies about its version is how install.sh went stale" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches lib/version.ml ($src)"

      - name: Create (or reuse) the release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          # A draft does not reserve a tag name against a second, public
          # release. Query first; never overwrite an already published asset.
          if draft="$(gh release view "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$draft" = true ] || {
              echo "release is already public; refusing to overwrite it" >&2; exit 1; }
            echo "reusing draft ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" \
              --draft --verify-tag --generate-notes $PRE
          fi

  binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: mere-linux-x86_64
          - os: macos-latest
            asset: mere-macos-arm64
    uses: ./.github/workflows/release-build.yml
    with:
      os: ${{ matrix.os }}
      asset: ${{ matrix.asset }}
      publish-draft: true

  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Publish checksums of the verified release assets
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          [ "$draft" = true ] || {
            echo "release is already public; refusing to replace checksums" >&2; exit 1; }
          mkdir -p dist roundtrip
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern mere-linux-x86_64 --pattern mere-macos-arm64 --dir dist
          python3 scripts/release_asset_check.py dist/mere-linux-x86_64 dist/mere-macos-arm64
          (cd dist && sha256sum mere-linux-x86_64 mere-macos-arm64 > SHA256SUMS)
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" dist/SHA256SUMS --clobber
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS --dir roundtrip
          (cd dist && sha256sum -c ../roundtrip/SHA256SUMS)

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages deploy via the official actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. Cancel in-progress on push but let
# the active one finish (so a half-deployed site isn't left behind).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPAMRETRIES: "2"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Configure Ubuntu package downloads
        timeout-minutes: 1
        run: sudo python3 scripts/ci_apt_setup.py /etc/apt

      - name: Set up OCaml
        timeout-minutes: 30
        uses: ocaml/setup-ocaml@v3
        with:
          cache: true
          ocaml-compiler: "5.1"

      - name: Install dependencies
        timeout-minutes: 15
        run: sh scripts/retry.sh opam install . --deps-only

      - name: Install wabt (wat2wasm)
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends wabt

      # binaryen as well, because build_full.sh runs wasm-opt -Oz: without it
      # the DEPLOYED site would ship modules a third larger than the ones CI
      # measures in scripts/wasm_size_check.sh. Two pipelines, one artifact, so
      # the same pinned version as ci.yml -- apt's 108 cannot read these modules
      # at all, and an unpinned optimizer would make the deployed bytes drift
      # away from the recorded ones without anything saying so.
      - name: Install binaryen (wasm-opt), pinned as in ci.yml
        timeout-minutes: 10
        run: |
          set -e
          BINARYEN=132
          mkdir -p "$HOME/.local/bin"
          curl --retry 2 --connect-timeout 20 --max-time 180 -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN}/binaryen-version_${BINARYEN}-x86_64-linux.tar.gz" \
            | tar -xz -C /tmp
          install "/tmp/binaryen-version_${BINARYEN}/bin/wasm-opt" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build mere
        timeout-minutes: 10
        run: opam exec -- dune build

      - name: Build docs site (mere SSG + wat2wasm)
        timeout-minutes: 20
        run: opam exec -- sh contrib/site/build_full.sh docs _site

      - name: Upload Pages artifact
        timeout-minutes: 5
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        timeout-minutes: 5
        id: deployment
        uses: actions/deploy-pages@v4
